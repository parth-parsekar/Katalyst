<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Katalyst - Unified Learning Tracker</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="brand">
      <div class="brand-icon">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
          <path d="M6 12v5c3 3 9 3 12 0v-5"/>
        </svg>
      </div>
      <span class="brand-title">Katalyst</span>
    </div>
    <button id="openWebBtn" class="open-web-btn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
        <polyline points="15 3 21 3 21 9"></polyline>
        <line x1="10" y1="14" x2="21" y2="3"></line>
      </svg>
      Open Web App
    </button>
  </header>

  <!-- Navigation Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="addTab">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="8" x2="12" y2="16"></line>
        <line x1="8" y1="12" x2="16" y2="12"></line>
      </svg>
      Quick Add
    </button>
    <button class="tab-btn" data-tab="listTab">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16"/>
      </svg>
      My Items (<span id="totalBadge">0</span>)
    </button>
    <button class="tab-btn" data-tab="statsTab">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="18" y1="20" x2="18" y2="10"></line>
        <line x1="12" y1="20" x2="12" y2="4"></line>
        <line x1="6" y1="20" x2="6" y2="14"></line>
      </svg>
      Stats
    </button>
  </nav>

  <!-- Content Container -->
  <main class="content">

    <!-- Tab 1: Quick Add -->
    <div id="addTab" class="tab-content active">
      <div class="glass-card">
        <form id="addResourceForm">
          <div class="form-group">
            <label for="resUrl">Resource URL</label>
            <input type="url" id="resUrl" class="form-input" placeholder="https://..." required>
          </div>

          <div class="form-group">
            <label for="resTitle">Title</label>
            <input type="text" id="resTitle" class="form-input" placeholder="e.g. Master Binary Trees in 20 Mins" required>
          </div>

          <!-- YouTube Timestamp Helper Row (Shows up if URL is YouTube) -->
          <div class="form-group" id="timestampGroup" style="display: none;">
            <label for="resTimestamp">YouTube Timestamp (Optional)</label>
            <div class="input-with-action">
              <input type="text" id="resTimestamp" class="form-input" placeholder="e.g., 2:45 or 1m24s">
              <button type="button" id="grabTimeBtn" class="action-btn-sm">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <circle cx="12" cy="12" r="10"></circle>
                  <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                Grab Time
              </button>
            </div>
          </div>

          <div class="grid-2">
            <div class="form-group">
              <label for="resCategory">Category</label>
              <select id="resCategory" class="form-select">
                <option value="DSA">DSA</option>
                <option value="Web Dev">Web Dev</option>
                <option value="System Design">System Design</option>
                <option value="Cloud">Cloud</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="resStatus">Initial Status</label>
              <select id="resStatus" class="form-select">
                <option value="To-Do">To-Do</option>
                <option value="In Progress">In Progress</option>
                <option value="Completed">Completed</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="resDescription">Notes / Description (Optional)</label>
            <textarea id="resDescription" class="form-textarea" rows="2" placeholder="Key takeaways or notes..."></textarea>
          </div>

          <button type="submit" class="submit-btn">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            Save to Katalyst
          </button>
        </form>
      </div>
    </div>

    <!-- Tab 2: My Resources -->
    <div id="listTab" class="tab-content">
      <div class="form-group" style="display: flex; gap: 8px;">
        <input type="text" id="searchInput" class="form-input" placeholder="Search resources...">
        <select id="filterCategory" class="form-select" style="width: 130px;">
          <option value="All">All Categories</option>
          <option value="DSA">DSA</option>
          <option value="Web Dev">Web Dev</option>
          <option value="System Design">System Design</option>
          <option value="Cloud">Cloud</option>
        </select>
      </div>

      <div id="resourceList" class="resource-list">
        <!-- Rendered dynamically -->
      </div>
    </div>

    <!-- Tab 3: Stats -->
    <div id="statsTab" class="tab-content">
      <div class="stats-grid">
        <div class="stat-box">
          <div class="stat-val" id="statTotal">0</div>
          <div class="stat-lbl">Total</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statTodo" style="color: #94a3b8;">0</div>
          <div class="stat-lbl">To-Do</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statInProgress" style="color: #f59e0b;">0</div>
          <div class="stat-lbl">In Progress</div>
        </div>
        <div class="stat-box">
          <div class="stat-val" id="statCompleted" style="color: #10b981;">0</div>
          <div class="stat-lbl">Completed</div>
        </div>
      </div>

      <div class="glass-card">
        <h4 style="font-size: 0.85rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 8px;">Quick Server Connection</h4>
        <p style="font-size: 0.75rem; color: var(--text-muted); line-height: 1.4;">
          API Server: <span style="color: var(--accent-cyan); font-family: monospace;">http://localhost:5000/api/resources</span><br>
          Connected via local Katalyst Express Backend.
        </p>
      </div>
    </div>

  </main>

  <!-- Toast Alert -->
  <div id="toast" class="toast">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toastMsg">Resource Saved!</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
